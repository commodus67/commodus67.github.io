name: Refresh soccer predictions

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the demo page from the Actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python build_predictions.py
      - name: Settle finished fixtures and rebuild the track record
        run: python track_record.py || echo "track record step failed, demo unaffected"
      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain soccer-predictions-demo.html data)" ]; then
            git add soccer-predictions-demo.html $([ -d data ] && echo data)
            git commit -m "Refresh soccer predictions"
            git push
          else
            echo "no change"
          fi
